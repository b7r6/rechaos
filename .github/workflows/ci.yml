# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#                                                                        // ci
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# One hermetic gate: `nix flake check` runs every check consistently —
#   test       — builds the gateway and runs the pure core suite (seeded
#                scheduler evaluation, JSON round-trips, targeting boundaries,
#                replay mismatch/coverage, oracle algebra, shrinking, golden
#                snapshots).
#   format     — fourmolu --mode check against the committed fourmolu.yaml.
#   lint       — hlint against the committed .hlint.yaml.
#   docs       — builds Haddock for the package and fails on doc errors.
#   cabalCheck — runs `cabal check` and fails on Hackage-metadata rot.
#   lean       — compiles the Lean 4 verified core under Lean 4.30 and fails
#                on any `sorry`/`admit`, machine-checking the determinism proofs.
# The `docs`, `cabalCheck`, and `lean` gates run automatically as part of
# `nix flake check -L` below — no extra step is needed.
# GitHub-compatible syntax; also runs under Forgejo/Gitea Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check (test + format + lint + docs + cabalCheck + lean)
        run: nix flake check -L
