# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#                                                                        // ci
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# One hermetic gate: `nix flake check` runs all three checks consistently —
#   test   — builds the gateway and runs the pure core suite (seeded scheduler
#            evaluation, JSON round-trips, targeting boundaries, replay
#            mismatch/coverage, oracle algebra, shrinking, golden snapshots).
#   format — fourmolu --mode check against the committed fourmolu.yaml.
#   lint   — hlint against the committed .hlint.yaml.
# GitHub-compatible syntax; also runs under Forgejo/Gitea Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check (test + format + lint)
        run: nix flake check -L
