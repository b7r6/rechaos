#                                                                        // ci
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Complete repository validation, including local wire/adapter tests, source
# packaging, generator drift, developer builds, and Lean. Check inventory:
# CONTRIBUTING.md. Keep CI on the same entry point used locally.
# GitHub-compatible syntax; also runs under Forgejo/Gitea Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check -L
